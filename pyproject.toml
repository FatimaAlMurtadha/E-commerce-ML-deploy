[project]
name = "e-commerce-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Neha", email = "31asatineha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "streamlit>=1.38",
